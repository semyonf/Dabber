# XcodeGen spec for the iPad broadcast spike. Run ./make-project.sh TEAM_ID to create the Xcode project.
name: DabberSpike
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DabberSpike:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DABBER_BUNDLE_PREFIX).spike
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dabber Spike
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Records your microphone during a broadcast.
        DabberAppGroup: $(DABBER_APP_GROUP)
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [$(DABBER_APP_GROUP)]
    dependencies:
      - target: DabberSpikeBroadcast
  DabberSpikeBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DABBER_BUNDLE_PREFIX).spike.broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Dabber Spike
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Records your microphone during a broadcast.
        DabberAppGroup: $(DABBER_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(DABBER_APP_GROUP)]
